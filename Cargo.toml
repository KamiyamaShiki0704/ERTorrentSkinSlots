[workspace]
resolver = "2"
members = ["."]

[workspace.dependencies]
pelite = "0.10"

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
]

[package]
name = "er-torrent-skin-slots"
version = "0.1.2"
edition = "2024"
description = "Configurable true expansion slots for Elden Ring Torrent appearances"
repository = "https://github.com/KamiyamaShiki0704/ERTorrentSkinSlots"
readme = "README.md"
license = "MIT"
publish = false

[lib]
name = "er_torrent_skin_slots"
crate-type = ["cdylib", "rlib"]

[dependencies]
shikifsrs-elden-ring = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "fb9f4524da1fb648e0a696f2d47aa08d3acf35cc" }
shikifsrs-runtime = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "fb9f4524da1fb648e0a696f2d47aa08d3acf35cc" }
ilhook = { version = "2.3.0", features = ["x64"] }
pelite.workspace = true
windows.workspace = true

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
