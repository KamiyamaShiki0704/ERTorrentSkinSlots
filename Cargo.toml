[workspace]
resolver = "2"
members = ["."]

[workspace.dependencies]
fromsoftware-shared = { git = "https://github.com/vswarte/eldenring-rs.git", rev = "eae96dfec94fd9cf6f9d24813c8d08f72019f243", version = "0.14.0", package = "fromsoftware-shared" }
eldenring = { git = "https://github.com/vswarte/eldenring-rs.git", rev = "eae96dfec94fd9cf6f9d24813c8d08f72019f243", version = "0.14.0", package = "eldenring" }
pelite = "0.10"

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Kernel",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
]

[package]
name = "er-torrent-skin-slots"
version = "0.1.0"
edition = "2024"
description = "Configurable true expansion slots for Elden Ring Torrent appearances"
repository = "https://github.com/KamiyamaShiki0704/ERTorrentSkinSlots"
readme = "README.md"
license = "MIT"
publish = false

[lib]
name = "er_torrent_skin_slots"
crate-type = ["cdylib", "rlib"]

[dependencies]
eldenring.workspace = true
fromsoftware-shared.workspace = true
ilhook = { version = "2.3.0", features = ["x64"] }
pelite.workspace = true
windows.workspace = true

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
